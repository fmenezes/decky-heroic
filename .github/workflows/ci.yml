name: CI

on:
  push:
    branches: ["*"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
